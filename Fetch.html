<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #pokemonImage{
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center
        }

    </style>
</head>
<body>

    <input type="text" id="pokename" placeholder="Enter Pokeman name">
    <button onclick="fetchData()">Search Pokemon</button>

    <img src="" alt="Pokemon Image" id="pokemonImage" style="display: none;">

    
    <script>
         async function fetchData(){
            try{

                const pokename = document.getElementById("pokename").value.toLowerCase();
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokename}`);

                if(!response.ok){
                    throw new Error("Something went wrong, Please check url again!!")
                }

                const data = await response.json();
                const pokemonImage = data.sprites.front_default;
                const imagElement = document.getElementById("pokemonImage");

                imagElement.src = pokemonImage;
                imagElement.style.display = "block";
                


               
            }
            catch(error){
                console.error(error);
            }
        }
        fetchData();

        //            (JSON style data, image , files)

        //             data asynchronously over the web.
